<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>sentAI Chat</title>
  <link rel="stylesheet" href="zoteroPane.css" />
</head>
<body>

  <div id="sentai-panel">

    <!-- Header -->
    <div id="sentai-header">
      <span id="sentai-header-title">sentAI</span>
      <span id="sentai-header-sub">Literatur-Assistent</span>
    </div>

    <!-- Search bar -->
    <div id="sentai-suche">
      <label>Literatur suchen</label>
      <div id="sentai-suche-zeile">
        <input id="sentai-suche-input" type="text" placeholder="Thema eingeben..." />
        <button id="sentai-suche-button">Suchen</button>
      </div>
    </div>

    <!-- Messages -->
    <div id="sentai-nachrichten">

      <div class="absender">sentAI</div>
      <div class="nachricht von-ki">
        Hallo! Stell mir eine Frage zu deiner Literatur.
      </div>

    </div>

    <!-- Input area -->
    <div id="sentai-eingabe">
      <div id="sentai-eingabe-zeile">
        <textarea id="sentai-eingabe-text" placeholder="Frage eingeben..."></textarea>
        <button id="sentai-senden-button">&#x27A4;</button>
      </div>
    </div>

  </div>

  <script src="scripts/chatPanel.js"></script>

</body>
</html>
