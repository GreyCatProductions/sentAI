<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox>
  <label>
    <html:h2 data-l10n-id="pref-title"></html:h2>
  </label>
  <hbox align="center">
    <html:label for="sentai-pref-model" data-l10n-id="pref-model-label" style="min-width: 120px"></html:label>
    <html:input type="text" id="sentai-pref-model" preference="embeddingModel" style="flex: 1" />
  </hbox>
  <hbox align="center" style="margin-top: 8px">
    <html:label for="sentai-pref-server-url" data-l10n-id="pref-server-url-label" style="min-width: 120px">
    </html:label>
    <html:input type="text" id="sentai-pref-server-url" preference="serverUrl" style="flex: 1" />
  </hbox>
  <hbox align="center" style="margin-top: 8px">
    <html:label for="sentai-pref-max-chunk-tokens" data-l10n-id="pref-max-chunk-tokens-label" style="min-width: 120px">
    </html:label>
    <html:input type="number" id="sentai-pref-max-chunk-tokens" preference="maxChunkTokens" min="100" max="2000"
      style="width: 80px" />
  </hbox>
  <hbox align="center" style="margin-top: 8px">
    <html:label for="sentai-pref-top-k" data-l10n-id="pref-top-k-label" style="min-width: 120px"></html:label>
    <html:input type="number" id="sentai-pref-top-k" preference="topK" min="1" max="50" style="width: 80px" />
  </hbox>
  <html:hr style="margin-top: 12px; margin-bottom: 4px" />
  <label>
    <html:h3 style="margin: 4px 0" data-l10n-id="pref-llm-section"></html:h3>
  </label>
  <hbox align="center" style="margin-top: 6px">
    <html:label for="sentai-pref-llm-api-key" data-l10n-id="pref-llm-api-key-label" style="min-width: 120px">
    </html:label>
    <html:input type="password" id="sentai-pref-llm-api-key" preference="llmApiKey" style="flex: 1" />
  </hbox>
  <hbox align="center" style="margin-top: 8px">
    <html:label for="sentai-pref-llm-endpoint" data-l10n-id="pref-llm-endpoint-label" style="min-width: 120px">
    </html:label>
    <html:input type="text" id="sentai-pref-llm-endpoint" preference="llmEndpoint"
      placeholder="Leave blank for default server" style="flex: 1" />
  </hbox>
  <hbox align="center" style="margin-top: 8px">
    <html:label for="sentai-pref-llm-model" data-l10n-id="pref-llm-model-label" style="min-width: 120px"></html:label>
    <html:input type="text" id="sentai-pref-llm-model" preference="llmModel" placeholder="e.g. claude-sonnet-4-6, gpt-4o"
      style="flex: 1" />
  </hbox>
  <html:hr style="margin-top: 12px; margin-bottom: 4px" />
  <hbox align="center" style="margin-top: 8px">
    <html:input type="checkbox" id="sentai-pref-auto-attach-pdf" preference="autoAttachPdf" />
    <html:label for="sentai-pref-auto-attach-pdf" data-l10n-id="pref-auto-attach-pdf-label" style="margin-left: 6px">
    </html:label>
  </hbox>
</groupbox>
